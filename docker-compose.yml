x-airflow-common: &airflow-common
  image: apache/airflow:2.8.0-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-pubg}:${POSTGRES_PASSWORD:-pubg_secret}@postgres:5432/airflow
    # Pass project env vars to Airflow tasks
    PUBG_API_KEY: ${PUBG_API_KEY}
    API_CALLS_LIMIT: ${API_CALLS_LIMIT:-10}
    PUBG_SHARD: ${PUBG_SHARD:-steam}
    PLAYER_NAMES: ${PLAYER_NAMES:-v1t1n}
    MAX_MATCHES_PER_PLAYER: ${MAX_MATCHES_PER_PLAYER:-0}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-pubg}
    POSTGRES_USER: ${POSTGRES_USER:-pubg}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pubg_secret}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/dags/src
    - ./sql:/opt/airflow/dags/sql
    - ./airflow/logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # -----------------------------------------------------------------------
  # PostgreSQL – shared by Airflow metadata DB AND the PUBG pipeline data
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pubg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pubg_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pubg}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run migration on first boot
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pubg}"]
      interval: 5s
      retries: 5

  # Create the Airflow metadata DB inside the same Postgres instance
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Create the airflow DB if it doesn't exist
        pip install psycopg2-binary > /dev/null 2>&1
        python -c "
        import psycopg2
        conn = psycopg2.connect(host='postgres', port=5432, dbname='${POSTGRES_DB:-pubg}', user='${POSTGRES_USER:-pubg}', password='${POSTGRES_PASSWORD:-pubg_secret}')
        conn.autocommit = True
        cur = conn.cursor()
        cur.execute(\"SELECT 1 FROM pg_database WHERE datname='airflow'\")
        if not cur.fetchone():
            cur.execute('CREATE DATABASE airflow')
        conn.close()
        "
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
    restart: "no"

  # -----------------------------------------------------------------------
  # Airflow webserver
  # -----------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  # -----------------------------------------------------------------------
  # Airflow scheduler
  # -----------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres_data:
